[package]
name = "ratatui-derive"
version = "0.1.0-beta.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Experimental derive macros and code generation helpers for Ratatui APIs."
documentation = "https://docs.rs/ratatui-derive"
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/**/*.stderr",
]

[package.metadata.ratatui-reservation]
area = "Experimental APIs"
future_scope = "derive macros and code generation helpers for Ratatui APIs"

[lib]
proc-macro = true

[dependencies]
darling = "0.23"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "3.0.3", features = ["full"] }

[dev-dependencies]
ratatui = "0.30.2"
ratatui-core = "0.1.2"
trybuild = { version = "1", features = ["diff"] }

[lints]
workspace = true

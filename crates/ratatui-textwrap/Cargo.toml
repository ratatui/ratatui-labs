[package]
name = "ratatui-textwrap"
version = "0.0.2"
publish = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Styled Ratatui text wrapping with textwrap algorithms and Paragraph compatibility."
readme = "README.md"
include = ["Cargo.toml", "CHANGELOG.md", "README.md", "docs/**/*.md", "src/**/*.rs"]

[dependencies]
# Keep this aligned with the umbrella crate so the workspace's direct-minimal dependency check can
# resolve one `ratatui-core` version.
ratatui-core = "0.1.2"
textwrap = { version = "0.16", default-features = false, features = ["smawk"] }

[dev-dependencies]
criterion = "0.8.2"
pretty_assertions = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rstest = "0.27"
unicode-width = "0.2.3"

[lints]
workspace = true

[[bench]]
name = "scroll"
harness = false
